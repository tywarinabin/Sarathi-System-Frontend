<div class="dashboard-container">
  <!-- Header -->
  <header class="dashboard-header">
    <div class="header-left">
      <button class="sidebar-toggle-btn" (click)="toggleSidebar()" title="Toggle sidebar">
        <app-icon name="menu" [size]="24"></app-icon>
      </button>
      <div class="logo">
        <span class="logo-icon">S</span>
        <span class="logo-text">Sarathi</span>
      </div>
    </div>
    <div class="header-right">
      <div class="user-info">
        <div class="user-avatar">
          <app-icon name="profile" [size]="20"></app-icon>
        </div>
        <div class="user-details">
          <p class="user-email">{{ userEmail }}</p>
        </div>
      </div>
      <button class="logout-btn" (click)="logout()" title="Logout">
        <app-icon name="logout" [size]="20"></app-icon>
      </button>
    </div>
  </header>

  <!-- Main Layout -->
  <div class="dashboard-body">
    <!-- Sidebar -->
    <aside class="sidebar" [class.open]="isSidebarOpen">
      <nav class="sidebar-nav">
        <h3 class="nav-title">Menu</h3>
        <ul class="nav-list">
          <li *ngFor="let item of menuItems" class="nav-item">
            <a
              [routerLink]="item.route"
              [routerLinkActiveOptions]="{ exact: false }"
              routerLinkActive="active"
              class="nav-link"
              (click)="closeSidebar()"
            >
              <app-icon [name]="item.icon" [size]="20"></app-icon>
              <span class="nav-label">{{ item.label }}</span>
            </a>
          </li>
        </ul>
      </nav>

      <!-- Support Section -->
      <div class="sidebar-support">
        <h4 class="support-title">Need Help?</h4>
        <p class="support-text">Check out our documentation or contact support.</p>
        <button class="support-btn">
          <app-icon name="chat" [size]="16"></app-icon>
          Get Support
        </button>
      </div>
    </aside>

    <!-- Content Area -->
    <main class="main-content" (click)="closeSidebar()">
      <router-outlet></router-outlet>
    </main>
  </div>

  <!-- Mobile Sidebar Overlay -->
  <div class="sidebar-overlay" [class.open]="isSidebarOpen" (click)="closeSidebar()"></div>
</div>
