<div class="overview-container">
  <div class="page-header">
    <h1 class="page-title">Dashboard</h1>
    <p class="page-subtitle">Welcome back! Here's your activity overview</p>
  </div>

  <!-- Stats Grid -->
  <div class="stats-grid">
    <div *ngFor="let stat of stats" class="stat-card">
      <div class="stat-icon" [style.background]="stat.color + '15'">
        <app-icon [name]="stat.icon" [size]="24" [color]="stat.color"></app-icon>
      </div>
      <div class="stat-content">
        <h3 class="stat-value">{{ stat.value }}</h3>
        <p class="stat-label">{{ stat.label }}</p>
      </div>
    </div>
  </div>

  <!-- Main Content Grid -->
  <div class="content-grid">
    <!-- Recent Activity -->
    <div class="card">
      <div class="card-header">
        <app-icon name="history" [size]="20"></app-icon>
        <h3 class="card-title">Recent Activity</h3>
      </div>
      <div class="card-body">
        <div class="activity-list">
          <div *ngFor="let activity of activities" class="activity-item">
            <div class="activity-indicator" [class]="activity.type"></div>
            <div class="activity-content">
              <p class="activity-title">{{ activity.title }}</p>
              <span class="activity-time">{{ activity.time }}</span>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Quick Actions -->
    <div class="card">
      <div class="card-header">
        <app-icon name="plus" [size]="20"></app-icon>
        <h3 class="card-title">Quick Actions</h3>
      </div>
      <div class="card-body action-body">
        <div *ngFor="let action of quickActions" class="quick-action">
          <a [href]="action.route" class="action-link">
            <div class="action-icon">
              <app-icon [name]="action.icon" [size]="20"></app-icon>
            </div>
            <span class="action-label">{{ action.label }}</span>
            <app-icon name="arrow-right" [size]="16"></app-icon>
          </a>
        </div>
      </div>
    </div>
  </div>
</div>
